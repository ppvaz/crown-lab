<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Crown Lab — Content Editor</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; display: flex; height: 100vh; background: #14141a; color: #d8d4c8;
             font: 13px/1.45 ui-monospace, monospace; }
      #panel { width: 340px; padding: 12px; overflow-y: auto; border-right: 1px solid #2c2c36;
               display: flex; flex-direction: column; gap: 10px; }
      #stage { flex: 1; display: flex; }
      canvas { flex: 1; width: 100%; height: 100%; }
      select, input, button { background: #1d1d26; color: inherit; border: 1px solid #3a3a48;
               border-radius: 3px; padding: 4px 6px; font: inherit; }
      button { cursor: pointer; }
      button:hover { border-color: #6a6a80; }
      #error { color: #ff8a7a; white-space: pre-wrap; }
      #error:empty { display: none; }
      .wave { border: 1px solid #2c2c36; border-radius: 4px; padding: 6px; }
      .wave header { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
      .spawn { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
      .muted { color: #8a8798; }
      h1 { font-size: 14px; margin: 0; }
      #toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <aside id="panel">
      <h1>CROWN LAB — CONTENT EDITOR</h1>
      <div id="toolbar">
        <button id="open">open…</button>
        <button id="download">download</button>
        <span id="dirty" class="muted"></span>
      </div>
      <input id="file" type="file" accept=".json" hidden />
      <select id="encounter"></select>
      <div id="error"></div>
      <div id="waves"></div>
    </aside>
    <main id="stage"><canvas id="floor"></canvas></main>
    <script type="module" src="/src/app/editor.ts"></script>
  </body>
</html>
