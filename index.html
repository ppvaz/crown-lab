<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crown Lab</title>
    <style>
      :root {
        color-scheme: dark;
        /*
          Page-control sizing, single-sourced so the panel offset below cannot disagree with it.

          34px with a mouse, 44px under a finger. NOT the 9mm/52px the action cluster uses: that
          threshold comes from repeated thumb actuation under time pressure, and these are pressed
          a few times a session, out of combat, with whichever finger is free. The floors that do
          apply are WCAG 2.2 AA's 24 CSS px — cleared either way — and "must never wrap", since a
          second control row is what put the boss bar underneath one. Oversizing them was not free:
          at 52px the row was 340px wide on a 360px phone and squeezed the encounter select to an
          unreadable stub.
        */
        --control-size: 34px;
        --control-inset: 10px;
        --control-gap: 6px;
      }
      body.touch-enabled { --control-size: 44px; --control-gap: 8px; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #08080b;
        color: #d8d4cc;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /*
        The data gate. Sized in `rem` and `clamp` rather than from the layout contract, because
        `render/layout.ts` lives in the host chunk this screen exists to defer — it is the one
        surface in the project that cannot ask the layout what size the type should be.
      */
      #gate {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #08080b;
      }
      #gate[hidden] { display: none; }
      #gate-card {
        max-width: 34rem;
        border: 1px solid #3a3222;
        padding: clamp(20px, 5vw, 36px);
        text-align: center;
      }
      #gate-title {
        margin: 0 0 0.6em;
        font-size: clamp(1.8rem, 7vw, 2.6rem);
        font-weight: 400;
        letter-spacing: 0.22em;
        color: #c8a94a;
      }
      #gate-note {
        margin: 0 0 1.6em;
        font-size: clamp(0.85rem, 3.4vw, 1rem);
        line-height: 1.6;
        color: #8d8779;
      }
      #gate-note b { color: #d8d4cc; font-weight: 400; }
      #gate-buttons { display: flex; flex-direction: column; gap: 10px; }
      .gate-button {
        /* 44px floor: this is a first-touch target on a phone and there is no second chance. */
        min-height: 44px;
        padding: 12px 18px;
        border: 1px solid #4a4231;
        background: transparent;
        color: #d8d4cc;
        font: inherit;
        font-size: clamp(0.9rem, 3.6vw, 1rem);
        letter-spacing: 0.14em;
        cursor: pointer;
      }
      .gate-button span {
        display: block;
        margin-top: 6px;
        font-size: 0.72em;
        letter-spacing: 0.04em;
        color: #7a7568;
      }
      .gate-button--primary { border-color: #c8a94a; color: #c8a94a; }
      .gate-button:hover, .gate-button:focus-visible { background: #14120c; }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #panel {
        position: absolute;
        top: 0;
        right: 0;
        /*
          `border-box`, so `width` means what the layout contract thinks it means. Under the
          default `content-box` the declared 340px became 365 on screen once 12px of padding each
          side and a 1px border were added, and the rail overhung its own region by 25px.
        */
        box-sizing: border-box;
        width: 340px;
        max-height: 100vh;
        overflow-y: auto;
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.45;
        background: rgba(8, 8, 11, 0.86);
        border-left: 1px solid #22222a;
        white-space: pre;
      }
      #panel-readout {
        white-space: pre;
      }
      #fps-meter {
        box-sizing: border-box;
        flex: none;
        width: 82px;
        height: var(--control-size);
        padding: 2px 5px;
        border: 1px solid rgba(224, 211, 178, 0.5);
        border-radius: 10px;
        background: rgba(8, 8, 11, 0.9);
        color: #eee5cf;
        font: 800 9px/1.05 ui-monospace, monospace;
        text-align: center;
        white-space: pre-line;
      }
      #fps-meter[hidden] { display: none; }
      #lab-actions {
        display: none;
        white-space: normal;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid #30303a;
      }
      .lab-actions__group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        margin-top: 9px;
      }
      .lab-actions__title {
        grid-column: 1 / -1;
        color: #9c978c;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .lab-action {
        min-height: 44px;
        padding: 7px 8px;
        border: 1px solid rgba(224, 211, 178, 0.38);
        border-radius: 8px;
        background: rgba(30, 28, 35, 0.9);
        color: #eee5cf;
        font: 700 10px/1.25 ui-monospace, monospace;
        touch-action: manipulation;
      }
      .lab-action:active {
        background: rgba(181, 141, 64, 0.75);
        transform: scale(0.98);
      }
      .lab-action[disabled] { opacity: 0.45; }
      /* The co-op door's row inside the panel. No position of its own: it is laid out by the
         panel like every other control there, so it names no viewport coordinate. */
      #coop-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        margin-bottom: 10px;
      }
      #coop-code {
        min-height: 44px;
        width: 108px;
        padding: 7px 9px;
        border: 1px solid rgba(224, 211, 178, 0.38);
        border-radius: 8px;
        background: rgba(12, 12, 16, 0.9);
        color: #eee5cf;
        font: 700 14px/1.25 ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #coop-hint {
        flex-basis: 100%;
        margin: 0;
        color: #9c978c;
        font: 400 10px/1.3 ui-monospace, monospace;
      }
      #coop-controls[hidden], #coop-code[hidden], #coop-hint[hidden] { display: none; }
      #panel[hidden] { display: none; }
      #touch-controls { display: none; }
      body.touch-enabled #touch-controls {
        position: absolute;
        inset: 0;
        display: block;
        pointer-events: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        z-index: 2;
      }
      /*
        PAGE CONTROLS — a sibling of #panel, never a child of #touch-controls.

        This used to live inside #touch-controls with `z-index: 4`, which reads as "above the
        panel at 3" and is not: #touch-controls sets `z-index: 2` and therefore opens a stacking
        context, so the toolbar's 4 only ever ordered it against its own siblings. The panel won,
        covered MODO: LAB, and lab mode became a room with no door. A z-index is only comparable
        to others in the same stacking context — moving the element out is the fix, not a bigger
        number.

        It is also not a touch control. Restart, pause and fullscreen are page controls: a
        desktop needs them just as much, and "press R" is not an interface. So this shows on
        every device, which is what makes the desktop build operable at all.
      */
      .page-controls {
        position: absolute;
        top: max(var(--control-inset), env(safe-area-inset-top));
        right: max(var(--control-inset), env(safe-area-inset-right));
        /*
          Capped, and `nowrap`. Wrapping is what put a second control row over the boss bar, so
          the row may not grow — which means on a 360px phone it must SHRINK instead, and without
          this cap it simply ran off the left edge: 377px of content anchored to the right of a
          340px budget. The select is the flexible part; see below.
        */
        max-width: calc(100vw - 20px);
        display: flex;
        flex-wrap: nowrap;
        justify-content: flex-end;
        align-items: center;
        gap: var(--control-gap);
        /*
          The strip is only as clickable as its buttons. A full-width bar with `pointer-events:
          auto` would eat every tap along the top of the arena, which is inside the fight.
        */
        pointer-events: none;
        z-index: 6;
      }
      .page-controls > * { pointer-events: auto; }
      /*
        `[hidden]` is a UA rule setting `display: none`, and `.page-controls button` below sets
        `display: flex` — a class selector beats a UA default, so the lab-mode toggle and the
        encounter select stayed on screen while their markup said hidden. `#panel[hidden]` above
        exists for exactly this reason; this is the same fix for the toolbar.
      */
      .page-controls [hidden] { display: none; }
      /*
        52px, and square. The old 38px-tall strip measured 7.0mm on a 390px phone — under the 9mm
        where thumb fatigue rises sharply and level with the 7mm hard floor — and the text labels
        were what forced it to wrap onto a second row, which is how the boss bar ended up
        underneath it. Icons buy the height back and take less width doing it.
      */
      .page-controls button {
        /*
          `flex: none`, because a flex item's declared width is only its *starting* size. Without
          this the row met its cap by shrinking the buttons instead of the select — 43px on a
          360px phone, which is 7.9mm and back under the fatigue threshold the icons bought.
          The select gives up the width; the targets do not.
        */
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--control-size);
        height: var(--control-size);
        padding: 0;
        border: 1px solid rgba(224, 211, 178, 0.5);
        border-radius: 10px;
        background: rgba(18, 17, 22, 0.82);
        color: #eee5cf;
        touch-action: manipulation;
        cursor: pointer;
      }
      .page-controls button:hover { border-color: rgba(224, 211, 178, 0.9); }
      .page-controls button:active { background: rgba(181, 141, 64, 0.75); }
      .page-controls button[aria-pressed='true'] {
        background: rgba(181, 141, 64, 0.55);
        border-color: rgba(224, 211, 178, 0.95);
      }
      .portal-direction {
        font: 800 calc(var(--control-size) * 0.52)/1 ui-monospace, monospace;
      }
      .page-controls select {
        height: var(--control-size);
        /* The only element allowed to give up width, and `min-width: 0` is what lets it. */
        flex: 0 1 auto;
        min-width: 0;
        max-width: min(38vw, 220px);
        padding: 0 10px;
        border: 1px solid rgba(224, 211, 178, 0.5);
        border-radius: 12px;
        background: rgba(18, 17, 22, 0.82);
        color: #eee5cf;
        font: 700 12px/1 ui-monospace, monospace;
        touch-action: manipulation;
      }
      /*
        Stroke styling lives on the descendants, not on the <svg>: `use` clones the symbol into a
        shadow tree, and inherited properties are what reach it. `.solid` is the escape hatch for
        the few glyphs that read better filled — its two-class specificity beats `.icon *`.
      */
      /* Scaled from the button, so one variable moves the glyph and its target together. */
      .icon {
        width: calc(var(--control-size) * 0.56);
        height: calc(var(--control-size) * 0.56);
        pointer-events: none;
      }
      .icon * {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon .solid { fill: currentColor; stroke: none; }
      #icon-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      /* Kept in the accessibility tree, off the screen — the icon carries the meaning visually. */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
        The stick and the action cluster belong to the touch device, and exactly one device is
        live at a time (see `InputDevice` in src/app/input.ts).
      */
      body:not(.input-touch) .touch-stick,
      body:not(.input-touch) .touch-actions {
        display: none;
      }
      /*
        ...and while the lab's instrument sheet is up. The contract says instruments on a phone are
        a different task, not an overlay: leaving the pad visible under the panel put all four
        combat buttons and the stick under a wall of lab controls, unreachable and still able to
        swing.

        Its own rule, not a fourth selector on the one above: `vite.config.ts` strips lab-only CSS
        by whole rule, and the public build's verifier fails on a `touch-lab-mode` marker reaching
        `index.html`. A shared rule cannot be stripped without taking the public half with it.
      */
      body.touch-lab-mode .touch-stick,
      body.touch-lab-mode .touch-actions {
        display: none;
      }
      /*
        One size in both orientations. Portrait used to take 34vw, and on a 360px phone that left
        only ~8px between the stick and a cluster wide enough to space its arc properly. The stick
        lost the argument on purpose: it is a relative-drag control, so a smaller radius costs
        analog resolution and nothing else, while the cluster was paying in mis-taps between two
        combat buttons. 30vw is still ~19mm of travel on the narrowest supported phone.

        `hud.ts` mirrors this to reserve the footprint instead of drawing resources behind it —
        change one and the stamina bar starts overlapping the pad, so change both.
      */
      .touch-stick {
        position: absolute;
        left: max(22px, env(safe-area-inset-left));
        bottom: max(34px, env(safe-area-inset-bottom));
        width: min(30vw, 150px);
        aspect-ratio: 1;
        border: 2px solid rgba(224, 211, 178, 0.42);
        border-radius: 50%;
        background: rgba(8, 8, 11, 0.35);
        pointer-events: auto;
      }
      .touch-stick__knob {
        position: absolute;
        inset: 27%;
        border-radius: 50%;
        background: rgba(224, 211, 178, 0.58);
        box-shadow: 0 0 18px rgba(224, 211, 178, 0.18);
      }
      /*
        The cluster is laid out in multiples of one button, never in percentages of its own
        box. Percentage offsets over fixed-size buttons collide the moment the box shrinks —
        which is exactly what the browser toolbar does to `dvh`, so POWER landed on ATK before
        entering fullscreen. Scaling the unit moves every button together instead.

        The offsets themselves are not eyeballed. The thumb has two axes and they do not cost
        the same: rotating about the base joint (adduction-abduction) takes roughly 75s to
        fatigue, while reaching out and curling back in (flexion-extension) takes roughly 42s
        and loads the abductor pollicis longus much harder. Buttons at *different* distances
        from the thumb's pivot therefore charge a flexion-extension move on every transition
        between them, and the comfortable region is a band around one radius — comfort falls
        off both further out and closer to the palm, so the screen corner is where the thumb
        anchors, not prime real estate.

        The old diagonal lattice spread the four core actions across ~1.1 button-widths of
        radius, which put ~36px of flexion-extension on the ATK/HEAVY alternation — the most
        frequent transition in the game. So:

          - light, heavy, guard and step sit on ONE arc of constant radius. These are the four
            that `availableTouchActions()` always returns, in both the public game and the lab,
            so the arc never shows a gap. Switching between them is pure rotation.
          - power, focus and interact are conditional and rare. They sit *inboard* of the arc,
            in the corner region the core four vacate: paying flexion-extension is fine for a
            button pressed a few times a run, and it keeps the comfortable band reserved.

        Slots are fixed, never reflowed to fill gaps. A button that moves between encounters
        would relearn itself every run, and this is a mastery lab.

        Geometry: pivot 0.4 units right of and below the box's bottom-right corner (about the
        screen corner, where the thumb base sits), arc radius 3.614 units, four buttons 20.38°
        apart from 14.42° to 75.58°. The arc's ends sit exactly on the corners of the region the
        box allows, which is not decoration: for a given box width that is the longest chord a
        four-button arc can have, so it is also the widest the buttons can be spaced. Shrink the
        box and the spacing is what pays.

        3.6 units, not 3.3, and the movement stick gave up the difference. At 3.3 the arc could
        only space centres 1.13 units apart, leaving ~1.3mm between the edges of two combat
        buttons — under the ~2mm where mis-taps start. Widening to 3.6 buys 1.28 units and
        ~2.7mm, and the only room available was the stick's: see `.touch-stick` below.

        `tests/touch-layout.test.ts` recomputes all of this from these very rules, and
        `npm run audit:touch` measures what it becomes in millimetres on real phones. Edit a
        number here and one of them will tell you which invariant you broke.
      */
      .touch-actions {
        /*
          15dvh, not 12: a landscape phone is ~390px tall, so the height term is what decides
          the size, and 12dvh put a 47px button under a thumb that misses it. Button size is
          its own fatigue term, independent of placement — 9mm targets outlast 3mm ones by
          about 1.7x — so this clamp is a floor to raise, never to lower. 3.3 units of cluster
          leaves ~170px of clear space between it and the toolbar, and it lands on the same
          button size portrait already uses.
        */
        --touch-btn: clamp(46px, min(13vw, 15dvh), 68px);
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(34px, env(safe-area-inset-bottom));
        width: calc(var(--touch-btn) * 3.6);
        height: calc(var(--touch-btn) * 3.6);
        pointer-events: none;
      }
      .touch-button {
        position: absolute;
        width: var(--touch-btn);
        height: var(--touch-btn);
        padding: 0;
        border: 1px solid rgba(224, 211, 178, 0.55);
        border-radius: 50%;
        background: rgba(18, 17, 22, 0.68);
        color: #eee5cf;
        font: 700 clamp(12px, 3.2vw, 15px)/1 ui-monospace, monospace;
        pointer-events: auto;
        touch-action: none;
      }
      .touch-button.is-held,
      .touch-button:active {
        background: rgba(181, 141, 64, 0.75);
        transform: scale(0.94);
      }
      /*
        APOTHEOSIS CHROME

        The ordinary selectors above are the shipping baseline. These overrides match only when
        the host applies the same explicit Apotheosis config used by the canvas renderer; removing
        the class restores the baseline without relying on a second page or a CSS reset.
      */
      body.apotheosis {
        background:
          radial-gradient(circle at 50% 38%, #181626 0%, #090a12 48%, #030409 100%);
      }
      body.apotheosis #panel {
        background:
          linear-gradient(180deg, rgba(19, 20, 30, 0.94), rgba(6, 7, 12, 0.94));
        border-left-color: rgba(201, 164, 91, 0.34);
        box-shadow: -18px 0 48px rgba(0, 0, 0, 0.46);
        backdrop-filter: blur(18px) saturate(1.2);
      }
      body.apotheosis .page-controls button {
        border-color: rgba(219, 184, 112, 0.56);
        background:
          linear-gradient(145deg, rgba(44, 43, 54, 0.9), rgba(9, 10, 16, 0.9));
        color: #f4e7c7;
        box-shadow:
          inset 0 1px 0 rgba(255, 240, 198, 0.1),
          0 7px 20px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(12px);
      }
      body.apotheosis .page-controls select {
        border-color: rgba(219, 184, 112, 0.56);
        background:
          linear-gradient(145deg, rgba(44, 43, 54, 0.92), rgba(9, 10, 16, 0.92));
        color: #f4e7c7;
        box-shadow:
          inset 0 1px 0 rgba(255, 240, 198, 0.1),
          0 7px 20px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(12px);
      }
      body.apotheosis .touch-stick {
        border-color: rgba(219, 184, 112, 0.48);
        background:
          radial-gradient(circle, rgba(52, 52, 66, 0.32), rgba(6, 7, 12, 0.64));
        box-shadow:
          inset 0 0 28px rgba(107, 124, 172, 0.11),
          0 12px 40px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(8px);
      }
      body.apotheosis .touch-stick__knob {
        background:
          radial-gradient(circle at 38% 32%, rgba(255, 239, 198, 0.86), rgba(177, 141, 71, 0.64));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.32),
          0 0 28px rgba(219, 184, 112, 0.28);
      }
      body.apotheosis .touch-button {
        border-color: rgba(219, 184, 112, 0.62);
        background:
          radial-gradient(circle at 36% 28%, rgba(62, 62, 77, 0.9), rgba(8, 9, 15, 0.88) 72%);
        color: #f5e7c6;
        text-shadow: 0 1px 8px rgba(219, 184, 112, 0.3);
        box-shadow:
          inset 0 1px 0 rgba(255, 244, 215, 0.12),
          inset 0 -8px 20px rgba(0, 0, 0, 0.32),
          0 10px 28px rgba(0, 0, 0, 0.42),
          0 0 0 3px rgba(23, 25, 38, 0.38);
        backdrop-filter: blur(10px);
      }
      body.apotheosis .touch-button.is-held,
      body.apotheosis .touch-button:active {
        background:
          radial-gradient(circle at 48% 44%, rgba(245, 215, 145, 0.94), rgba(157, 105, 38, 0.86));
        color: #17131a;
        box-shadow:
          inset 0 3px 12px rgba(61, 36, 10, 0.5),
          0 0 30px rgba(219, 184, 112, 0.48);
      }
      /*
        Centres stay at least 1.27 buttons apart, so no pair can touch at any unit size — and,
        past mere contact, so two combat buttons keep ~2.7mm of clear space between their edges on
        a mid-size phone, which is where mis-taps stop being likely.

        The core arc, sweeping from the box's bottom-left up to its top-right. Order along it is
        by how often a pair is alternated, not by importance: HEAVY and ATK are adjacent because
        light/heavy is the combo alternation, GUARD is adjacent to ATK because blocking then
        punishing is the next most common pair, and both sit near the thumb's ~45° rest angle so
        neither a fast alternation nor a held guard parks the thumb at end-range. STEP takes the
        far end — it is a reactive tap, so it can afford the extreme that a held button cannot.
      */
      .touch-button--heavy {
        right: calc(var(--touch-btn) * 2.6);
        bottom: 0;
      }
      .touch-button--light {
        right: calc(var(--touch-btn) * 2.067);
        bottom: calc(var(--touch-btn) * 1.163);
      }
      .touch-button--guard {
        right: calc(var(--touch-btn) * 1.163);
        bottom: calc(var(--touch-btn) * 2.067);
      }
      .touch-button--step {
        right: 0;
        bottom: calc(var(--touch-btn) * 2.6);
      }
      /*
        The conditional actions, inboard of the arc. POWER is the one of the three the public
        game always shows, so it takes the outermost of the inner slots; ACT takes the most
        curled one because interaction happens between fights, not under pressure.
      */
      .touch-button--power {
        right: 0;
        bottom: calc(var(--touch-btn) * 1.3);
      }
      .touch-button--focus {
        right: calc(var(--touch-btn) * 1.3);
        bottom: 0;
      }
      .touch-button--interact {
        right: 0;
        bottom: 0;
        border-radius: 18px;
      }
      @media (orientation: portrait) {
        .touch-actions { --touch-btn: clamp(46px, min(15vw, 9dvh), 68px); }
      }
      /*
        Below the page controls, in every configuration. The panel used to start at y=0 on a
        desktop and at a hand-fitted 50px on a phone — the guess that put it over the control row
        the moment the row grew.
      */
      #panel {
        top: calc(var(--control-inset) * 2 + var(--control-size));
        max-height: calc(100dvh - var(--control-inset) * 2 - var(--control-size));
      }
      body.touch-enabled.touch-lab-mode #panel {
        z-index: 3;
        box-sizing: border-box;
        width: min(340px, calc(100vw - 20px));
        max-height: calc(100dvh - var(--control-inset) - var(--control-size) - 22px);
      }
      body.touch-enabled.touch-lab-mode #lab-actions {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg id="icon-defs" aria-hidden="true" focusable="false">

      <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.05 11a8 8 0 1 1 .5 4m-.5 5v-5h5" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12" /><path d="M14 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -12" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13 -8l-13 -8" /></symbol>
      <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 8v-2a2 2 0 0 1 2 -2h2" /><path d="M4 16v2a2 2 0 0 0 2 2h2" /><path d="M16 4h2a2 2 0 0 1 2 2v2" /><path d="M16 20h2a2 2 0 0 0 2 -2v-2" /></symbol>
      <symbol id="i-fullscreen-exit" viewBox="0 0 24 24"><path d="M15 19v-2a2 2 0 0 1 2 -2h2" /><path d="M15 5v2a2 2 0 0 0 2 2h2" /><path d="M5 15h2a2 2 0 0 1 2 2v2" /><path d="M5 9h2a2 2 0 0 0 2 -2v-2" /></symbol>
      <symbol id="i-lab" viewBox="0 0 24 24"><path d="M6.1 15h11.8" /><path d="M14 3v7.342a6 6 0 0 1 1.318 10.658h-6.635a6 6 0 0 1 1.317 -10.66v-7.34h4" /><path d="M9 3h6" /></symbol>
      <symbol id="i-game" viewBox="0 0 24 24"><path d="M12 5h3.5a5 5 0 0 1 0 10h-5.5l-4.015 4.227a2.3 2.3 0 0 1 -3.923 -2.035l1.634 -8.173a5 5 0 0 1 4.904 -4.019h3.4" /><path d="M14 15l4.07 4.284a2.3 2.3 0 0 0 3.925 -2.023l-1.6 -8.232" /><path d="M8 9v2" /><path d="M7 10h2" /><path d="M14 10h2" /></symbol>

    </svg>



    <div id="gate" hidden>
      <div id="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-title">
        <h1 id="gate-title">CROWN</h1>
        <p id="gate-note">This game downloads its own art and music as you play. About <b id="gate-start">—</b> to start, and up to <b id="gate-full">—</b> if you walk the whole route with the score.</p>
        <div id="gate-buttons">
          <button id="gate-play" type="button" class="gate-button gate-button--primary">Play</button>
          <button id="gate-saver" type="button" class="gate-button">Play · data saver<span>music and 3D stay off until you ask, with the size shown</span></button>
        </div>
      </div>
    </div>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="panel" hidden>
        <div id="lab-actions" aria-label="Lab actions">


          <div class="lab-actions__group">
            <div class="lab-actions__title">Run</div>
            <button class="lab-action" type="button" data-lab-key="KeyR">Restart</button>
            <button class="lab-action" type="button" data-lab-key="KeyP">Pause / resume</button>
            <button class="lab-action" type="button" data-lab-key="KeyO">Step 1 tick</button>
            <button class="lab-action" type="button" data-lab-key="KeyV">Replay last run</button>
            <button class="lab-action" type="button" data-lab-key="Digit6" aria-pressed="false">FPS meter</button>
            <button class="lab-action" type="button" data-lab-key="KeyZ">Next mode</button>
          </div>
          <div class="lab-actions__group">
            <div class="lab-actions__title">Instruments</div>
            <button class="lab-action" type="button" data-lab-key="KeyH">Hitboxes</button>
            <button class="lab-action" type="button" data-lab-key="KeyT">Timeline</button>
            <button class="lab-action" type="button" data-lab-key="KeyY">States</button>
            <button class="lab-action" type="button" data-lab-key="KeyE" data-lab-shift="true">Export run</button>
            <button class="lab-action" type="button" data-lab-key="KeyI">Invincible</button>
            <button class="lab-action" type="button" data-lab-key="KeyG">Infinite stamina</button>
          </div>
          <div class="lab-actions__group">
            <div class="lab-actions__title">Simulation</div>
            <button class="lab-action" type="button" data-lab-key="BracketLeft">Previous combat</button>
            <button class="lab-action" type="button" data-lab-key="BracketRight">Next combat</button>
            <button class="lab-action" type="button" data-lab-key="Semicolon">Previous slow-mo</button>
            <button class="lab-action" type="button" data-lab-key="Quote">Next slow-mo</button>
            <button class="lab-action" type="button" data-lab-key="Comma">Previous encounter</button>
            <button class="lab-action" type="button" data-lab-key="Period">Next encounter</button>
            <button class="lab-action" type="button" data-lab-key="Minus">Seed −</button>
            <button class="lab-action" type="button" data-lab-key="Equal">Seed +</button>
          </div>
          <div class="lab-actions__group">
            <div class="lab-actions__title">Presentation</div>
            <button class="lab-action" type="button" data-lab-key="Digit1">Previous presentation</button>
            <button class="lab-action" type="button" data-lab-key="Digit2">Next presentation</button>
            <button class="lab-action" type="button" data-lab-key="Digit3">Next material</button>
            <button class="lab-action" type="button" data-lab-key="Digit4">Next model</button>
            <button class="lab-action" type="button" data-lab-key="Backslash">Next weather</button>
            <button class="lab-action" type="button" data-lab-key="Slash">Camera: action / static</button>
            <button class="lab-action" type="button" data-lab-key="Digit0">Next apotheosis</button>
            <button class="lab-action" type="button" data-lab-key="KeyN">Next aim mode</button>
            <button class="lab-action" type="button" data-lab-key="KeyM">Audio on / off</button>
            <button class="lab-action" type="button" data-lab-key="Digit5">Import audio</button>
            <button class="lab-action" type="button" data-lab-key="Digit7">Import run</button>
            <button class="lab-action" type="button" data-lab-key="Backquote" aria-pressed="false">Mesh king</button>
            <button class="lab-action" type="button" data-lab-key="F9">Room: MSAA on / off</button>
            <button class="lab-action" type="button" data-lab-key="F9" data-lab-shift="true">Room: scale</button>
          </div>
          <div class="lab-actions__group">
            <div class="lab-actions__title">Session</div>
            <button class="lab-action" type="button" data-lab-key="KeyC">Route: first crown</button>
            <button class="lab-action" type="button" data-lab-key="KeyX">Restore defaults</button>
          </div>
        </div>


        <div id="coop-controls">
          <button class="lab-action" type="button" id="coop-host" hidden>Host a room</button>
          <button class="lab-action" type="button" id="coop-join" hidden>Join a room</button>
          <input id="coop-code" type="text" inputmode="latin" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" aria-label="Room code" placeholder="ABC234" hidden />
          <button class="lab-action" type="button" id="coop-join-link" hidden>Copy join link</button>
          <button class="lab-action" type="button" id="coop-start" hidden>Start</button>
          <p id="coop-hint" hidden></p>
        </div>
        <div id="panel-readout"></div>
      </div>
      <div class="page-controls" role="toolbar" aria-label="Page controls">
        <select id="touch-encounter" aria-label="Select encounter" hidden></select>
        <output id="fps-meter" aria-label="Performance meter" hidden></output>
        <button id="maze-portal-steps" type="button" title="Portal stairs: up" aria-label="Portal stairs: up; toggle direction" aria-pressed="false" hidden>
          <span class="portal-direction" aria-hidden="true">↑</span>
        </button>
        <button id="touch-restart" type="button" title="Restart" aria-label="Restart">
          <svg class="icon"><use href="#i-restart" /></svg>
        </button>
        <button id="touch-pause" type="button" title="Pause" aria-label="Pause" aria-pressed="false">
          <svg class="icon"><use href="#i-pause" /></svg>
        </button>
        <button id="touch-view-mode" type="button" title="Lab mode" aria-label="Lab mode" aria-pressed="false" hidden>
          <svg class="icon"><use href="#i-game" /></svg>
        </button>
        <button id="touch-fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false">
          <svg class="icon"><use href="#i-fullscreen" /></svg>
        </button>
      </div>
      <div id="touch-controls" aria-label="Game controls">
        <div class="touch-stick" data-touch-stick aria-label="Movement">
          <div class="touch-stick__knob" data-touch-knob></div>
        </div>
        <div class="touch-actions">
          <button class="touch-button touch-button--light" data-touch-action="light" aria-label="Light attack">ATK</button>
          <button class="touch-button touch-button--heavy" data-touch-action="heavy" aria-label="Heavy attack">HEAVY</button>
          <button class="touch-button touch-button--guard" data-touch-action="guard" aria-label="Guard">GUARD</button>
          <button class="touch-button touch-button--step" data-touch-action="step" aria-label="Step">STEP</button>
          <button class="touch-button touch-button--power" data-touch-action="power" aria-label="Power">POWER</button>
          <button class="touch-button touch-button--focus" data-touch-action="focus" aria-label="Focus">FOCUS</button>
          <button class="touch-button touch-button--interact" data-touch-action="interact" aria-label="Act">ACT</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
